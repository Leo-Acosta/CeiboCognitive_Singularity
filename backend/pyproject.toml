[project]
name = "ceibo-core"
version = "0.1.0"
description = "Enterprise-grade multi-agent AI assistant core."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0,<0.137.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "redis>=5.0.4",
  "httpx>=0.27.0",
  "nats-py>=2.7.2",
  "qdrant-client>=1.9.1",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.4.8",
  "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceibo_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-o cache_dir=.tmp-tests/pytest-cache"
