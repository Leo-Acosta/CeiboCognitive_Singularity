apiVersion: v1
kind: Service
metadata:
  name: ceibo-core-api
  labels:
    {{- include "ceibo-core.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: ceibo-core
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.api.port }}
