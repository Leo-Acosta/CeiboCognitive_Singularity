apiVersion: v1
kind: Secret
metadata:
  name: ceibo-core-secrets
  labels:
    {{- include "ceibo-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://ceibo:%s@postgres:5432/ceibo_core" .Values.secrets.postgresPassword | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
