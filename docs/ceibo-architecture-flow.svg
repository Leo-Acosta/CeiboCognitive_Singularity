<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura CEIBO CORE</title>
  <desc id="desc">Diagrama de flujo de la arquitectura general de CEIBO CORE, con capas de experiencia, entrada, nucleo inteligente, agentes, IA, datos, eventos, observabilidad e infraestructura.</desc>
